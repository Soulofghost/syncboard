<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncBoard | Real-Time Collaborative Canvas Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Top Navigation & Presence Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="brand-symbol">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18"/>
          <path d="M9 21V9"/>
        </svg>
      </div>
      <div>
        <h1 class="brand-title">SyncBoard <span class="tag-ws">MULTIPLAYER</span></h1>
        <p class="room-indicator" id="currentRoomLabel">Room: Default Architecture Canvas</p>
      </div>
    </div>

    <!-- Active Peers / Multiplayer Presence -->
    <div class="header-right">
      <div class="peers-list" id="peersList">
        <!-- Rendered dynamically -->
      </div>
      <div class="action-buttons">
        <button class="btn btn-outline" id="btnSnapshots">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
          Snapshots
        </button>
        <button class="btn btn-outline" id="btnExport">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export PNG
        </button>
        <button class="btn btn-secondary" id="btnRooms">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Switch Room
        </button>
      </div>
    </div>
  </header>

  <!-- Infinite Canvas Container -->
  <main class="canvas-viewport" id="viewport">
    <canvas id="whiteboardCanvas"></canvas>
    <!-- Remote Peer Cursors Layer -->
    <div id="cursorsLayer" class="cursors-container"></div>
  </main>

  <!-- Floating Floating Tool Palette -->
  <aside class="floating-palette">
    <div class="tool-section">
      <button class="tool-btn active" data-tool="select" title="Select / Move">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 3 7 18 3-7 7-3L3 3z"/></svg>
      </button>
      <button class="tool-btn" data-tool="pen" title="Freehand Pen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rectangle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button class="tool-btn" data-tool="circle" title="Circle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Arrow Connector">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
      <button class="tool-btn" data-tool="note" title="Sticky Note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" title="Text Label">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>
      <button class="tool-btn" data-tool="eraser" title="Eraser">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <!-- Color Chits -->
    <div class="color-section">
      <button class="color-chip active" data-color="#0f172a" style="background:#0f172a;"></button>
      <button class="color-chip" data-color="#2563eb" style="background:#2563eb;"></button>
      <button class="color-chip" data-color="#059669" style="background:#059669;"></button>
      <button class="color-chip" data-color="#ea580c" style="background:#ea580c;"></button>
      <button class="color-chip" data-color="#db2777" style="background:#db2777;"></button>
      <button class="color-chip" data-color="#7c3aed" style="background:#7c3aed;"></button>
    </div>

    <div class="divider"></div>

    <div class="tool-section">
      <button class="tool-btn btn-danger" id="btnClearBoard" title="Clear Canvas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </aside>

  <!-- Rooms Management Modal -->
  <div id="roomsModal" class="modal-backdrop hidden">
    <div class="modal-window">
      <div class="modal-head">
        <h3>Collaborative Workspaces</h3>
        <button class="btn-close" id="btnCloseRooms">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createRoomForm" class="room-create-row">
          <input type="text" id="newRoomName" placeholder="New Workspace Name..." required class="input-ctrl">
          <button type="submit" class="btn btn-primary">Create Room</button>
        </form>
        <div class="rooms-grid" id="roomsList">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Snapshots Modal -->
  <div id="snapshotsModal" class="modal-backdrop hidden">
    <div class="modal-window">
      <div class="modal-head">
        <h3>Board Version Snapshots</h3>
        <button class="btn-close" id="btnCloseSnapshots">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createSnapshotForm" class="room-create-row">
          <input type="text" id="snapshotName" placeholder="Snapshot title (e.g. Architecture v1.2)..." required class="input-ctrl">
          <button type="submit" class="btn btn-primary">Take Snapshot</button>
        </form>
        <div class="snapshots-list" id="snapshotsList">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
